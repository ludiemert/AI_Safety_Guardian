<!DOCTYPE html>
<!-- This defines the HTML document -->

<html lang="en">
<!-- This starts the HTML page -->

<head>
  <!-- Page settings -->

  <meta charset="UTF-8">
  <!-- This sets text format -->

  <title>Result - AI Safety Guardian</title>
  <!-- This is the page title -->

  <!-- Load CSS file -->
  <link rel="stylesheet" href="/static/style.css">

  <!-- Load favicon icon -->
  <link rel="icon" href="/static/favicon.ico">
</head>

  <script>
  const playAlarm = "{{ play_alarm }}" === "True";

  if (playAlarm) {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(900, audioContext.currentTime);
    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.8);
  }
  </script>

<body>
<!-- This is the page content -->

  <!-- Container box in center -->
  <div class="container">

    <!-- Page title -->
    <h1>Image Result</h1>

    <h2>{{ safety_status }}</h2>

    <p><strong>Risk Level:</strong> {{ risk_level }}</p>

    <p><strong>Message:</strong> {{ safety_message }}</p>

    <p><strong>Edge Score:</strong> {{ edge_percentage }}%</p>

    <!-- Show original image -->
    <p>Original Image</p>
    <img src="{{ original_image }}" class="preview-image">
    <!-- This shows the uploaded image -->

    <!-- Show processed image -->
    <p>Processed Image</p>
    <img src="{{ result_image }}" class="preview-image">
    <!-- This shows the processed image -->

    <!-- Button to go back -->
    <a href="/">
      <button>Back Home</button>
    </a>

  </div>

</body>
</html>
